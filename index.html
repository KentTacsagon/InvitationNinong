<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Invitation from Katkat</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%), 
                        radial-gradient(circle at 50% 50%, #e3f2fd 0%, #ffffff 100%);
            text-align: center;
            padding: 20px;
        }

        #container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 95%;
            border: 2px solid #e3f2fd;
        }

        .header-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #bbdefb;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 { color: #1976d2; font-size: 1.7rem; margin: 10px 0; }
        
        .details-box {
            background-color: #f1f8ff;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            border: 1px dashed #90caf9;
        }

        .details-box p {
            margin: 5px 0;
            color: #455a64;
            font-weight: 500;
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            min-height: 120px;
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: all 0.1s ease;
        }

        #yesBtn {
            background-color: #66bb6a;
            color: white;
            z-index: 1000;
        }

        #noBtn {
            background-color: #ef5350;
            color: white;
        }

        #form-section { display: none; }
        
        #rsvp-form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        
        input[type="text"] {
            padding: 15px;
            border: 2px solid #e3f2fd;
            border-radius: 12px;
            font-size: 16px;
        }

        .submit-btn {
            background-color: #1976d2;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="container">
        <img src="image-removebg-preview.png" alt="Katkat" class="header-img">

        <div id="question-section">
            <h1>Will you be my Ninong?</h1>
            
            <div class="details-box">
                <p>📅 <strong>April 18, 2026</strong></p>
                <p>⏰ <strong>10:00 AM</strong></p>
                <p>📍 <strong>St. Anthony Abbot Parish</strong></p>
                <p>Tubungan, Iloilo</p>
            </div>

            <p>I'd love for you to be part of my big day! 🙏</p>
            
            <div class="buttons">
                <button id="yesBtn">YES!</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="form-section">
            <h1>Yehey! 🕊️</h1>
            <p>I'm so excited! Please enter your name so I can list you down.</p>
            <form id="rsvp-form" action="https://formspree.io/f/xojkvpyq" method="POST">
                <input type="text" name="ninong_name" placeholder="Enter your full name" required>
                <button type="submit" class="submit-btn">Confirm RSVP</button>
            </form>
        </div>
    </div>

    <script>
        // Use DOMContentLoaded to ensure the page is fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const questionSection = document.getElementById('question-section');
            const formSection = document.getElementById('form-section');

            let yesSize = 18;
            let paddingLevel = 15;

            // Grow Yes logic
            noBtn.addEventListener('click', function() {
                yesSize += 35;
                paddingLevel += 15;
                
                yesBtn.style.fontSize = yesSize + "px";
                yesBtn.style.padding = paddingLevel + "px " + (paddingLevel * 2) + "px";

                const phrases = ["Wrong choice!", "May gin prepare ako nga handa", "Ninong, please!", "Katkat is waiting!", "Katkat is sad", "Error: Access Denied"];
                noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            });

            // Show Form logic
            yesBtn.addEventListener('click', function() {
                questionSection.style.display = 'none';
                formSection.style.display = 'block';
            });
        });
    </script>
</body>
</html>
